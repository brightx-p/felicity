<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Felicity Empire Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="admin-body">

    <button class="admin-mobile-toggle" onclick="adminToggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="admin-mobile-overlay" onclick="adminToggleSidebar()"></div>

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-brand"><div class="admin-brand-name">FELICITY<span class="admin-brand-accent">EMPIRE</span></div><div class="admin-brand-subtitle">Administration</div></div>
        <nav class="admin-sidebar-nav">
            <div class="admin-sidebar-section">Main</div>
            <a href="index.html" class="admin-sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="products.html" class="admin-sidebar-link"><i class="fas fa-box"></i> Products</a>
            <a href="orders.html" class="admin-sidebar-link"><i class="fas fa-shopping-bag"></i> Orders</a>
            <a href="appointments.html" class="admin-sidebar-link"><i class="fas fa-calendar-check"></i> Appointments</a>
            <a href="customers.html" class="admin-sidebar-link"><i class="fas fa-users"></i> Customers</a>
            <div class="admin-sidebar-section">Content</div>
            <a href="categories.html" class="admin-sidebar-link"><i class="fas fa-tags"></i> Categories</a>
            <a href="gallery.html" class="admin-sidebar-link"><i class="fas fa-images"></i> Gallery</a>
            <a href="videos.html" class="admin-sidebar-link"><i class="fas fa-video"></i> Videos</a>
            <a href="reviews.html" class="admin-sidebar-link"><i class="fas fa-star"></i> Reviews</a>
            <div class="admin-sidebar-section">Management</div>
            <a href="analytics.html" class="admin-sidebar-link"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="notifications.html" class="admin-sidebar-link"><i class="fas fa-bell"></i> Notifications</a>
            <a href="qr-code.html" class="admin-sidebar-link"><i class="fas fa-qrcode"></i> QR Code</a>
            <a href="settings.html" class="admin-sidebar-link active"><i class="fas fa-cog"></i> Settings</a>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="profile.html"><i class="fas fa-user-circle"></i> Admin Profile</a>
            <a href="../index.html"><i class="fas fa-external-link-alt"></i> View Website</a>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <div class="admin-topbar-left"><h1>Settings</h1><span class="admin-topbar-breadcrumb">Business configuration</span></div>
        </div>

        <div class="admin-page-content">
            <div class="admin-card" style="max-width:800px;">
                <div class="admin-card-header"><h3>Business Information</h3></div>
                
                <div class="admin-form-group"><label class="admin-form-label">Business Name</label><input type="text" class="admin-form-input" id="setBizName" value="Felicity Empire" /></div>
                <div class="admin-form-group"><label class="admin-form-label">Business Logo</label>
                    <div class="admin-upload-zone" onclick="document.getElementById('setLogoInput').click()">
                        <i class="fas fa-cloud-upload-alt"></i><h4>Upload Logo</h4>
                        <input type="file" id="setLogoInput" accept="image/*" onchange="handleSettingImageUpload(event, 'setLogoPreview', 'logo')" style="display:none;" />
                    </div>
                    <div id="setLogoPreview" style="margin-top:10px;"></div>
                </div>
                <div class="admin-form-row">
                    <div class="admin-form-group"><label class="admin-form-label">WhatsApp Number</label><input type="text" class="admin-form-input" id="setWhatsapp" value="2348125913807" /></div>
                    <div class="admin-form-group"><label class="admin-form-label">Business Phone</label><input type="text" class="admin-form-input" id="setPhone" value="08125913807" /></div>
                </div>
                <div class="admin-form-group"><label class="admin-form-label">Email Address</label><input type="email" class="admin-form-input" id="setEmail" value="info@felicityempire.com" /></div>
                <div class="admin-form-row">
                    <div class="admin-form-group"><label class="admin-form-label">Instagram</label><input type="text" class="admin-form-input" id="setInstagram" value="@felicityempire" /></div>
                    <div class="admin-form-group"><label class="admin-form-label">Facebook</label><input type="text" class="admin-form-input" id="setFacebook" value="felicityempire" /></div>
                </div>
                <div class="admin-form-group"><label class="admin-form-label">Business Address</label><input type="text" class="admin-form-input" id="setAddress" value="Lagos, Nigeria" /></div>
                <div class="admin-form-group"><label class="admin-form-label">Delivery Information</label><textarea class="admin-form-textarea" id="setDelivery">Free delivery on orders over N50,000. Standard delivery within 3-5 business days.</textarea></div>
                <div class="admin-form-group"><label class="admin-form-label">Appointment Hours</label><input type="text" class="admin-form-input" id="setHours" value="Mon - Sat, 9AM - 6PM" /></div>
                <div class="admin-form-group"><label class="admin-form-label">Currency</label><select class="admin-form-select" id="setCurrency"><option value="NGN">Nigerian Naira (N)</option><option value="USD">US Dollar ($)</option></select></div>
                
                <button class="admin-btn admin-btn-primary admin-btn-lg" onclick="saveSettings()" style="margin-top:20px;"><i class="fas fa-save"></i> Save Settings</button>
            </div>
        </div>
    </main>

    <div class="admin-toast-container"></div>

    <script src="../assets/js/admin.js"></script>
    <script>
        let settingImages = {};

        function getSettings() { return JSON.parse(localStorage.getItem('fe_admin_settings') || '{}'); }
        function saveSettingsData(data) { localStorage.setItem('fe_admin_settings', JSON.stringify(data)); }

        function loadSettings() {
            const s = getSettings();
            document.getElementById('setBizName').value = s.bizName || 'Felicity Empire';
            document.getElementById('setWhatsapp').value = s.whatsapp || '2348125913807';
            document.getElementById('setPhone').value = s.phone || '08125913807';
            document.getElementById('setEmail').value = s.email || 'info@felicityempire.com';
            document.getElementById('setInstagram').value = s.instagram || '@felicityempire';
            document.getElementById('setFacebook').value = s.facebook || 'felicityempire';
            document.getElementById('setAddress').value = s.address || 'Lagos, Nigeria';
            document.getElementById('setDelivery').value = s.delivery || '';
            document.getElementById('setHours').value = s.hours || 'Mon - Sat, 9AM - 6PM';
            document.getElementById('setCurrency').value = s.currency || 'NGN';
            settingImages = s.images || {};
            if (settingImages.logo) document.getElementById('setLogoPreview').innerHTML = `<img src="${settingImages.logo}" style="width:120px;border-radius:8px;" />`;
        }

        function handleSettingImageUpload(event, previewId, key) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                settingImages[key] = e.target.result;
                document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" style="width:120px;border-radius:8px;" />`;
            };
            reader.readAsDataURL(file);
        }

        function saveSettings() {
            const settings = {
                bizName: document.getElementById('setBizName').value,
                whatsapp: document.getElementById('setWhatsapp').value,
                phone: document.getElementById('setPhone').value,
                email: document.getElementById('setEmail').value,
                instagram: document.getElementById('setInstagram').value,
                facebook: document.getElementById('setFacebook').value,
                address: document.getElementById('setAddress').value,
                delivery: document.getElementById('setDelivery').value,
                hours: document.getElementById('setHours').value,
                currency: document.getElementById('setCurrency').value,
                images: settingImages,
                updatedAt: new Date().toISOString()
            };
            saveSettingsData(settings);
            adminToast('Settings saved successfully!');
        }

        loadSettings();
    </script>
</body>
</html>
