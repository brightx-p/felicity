<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Felicity Empire</title>
    <meta name="description"
        content="Complete your order at Felicity Empire. Luxury beauty and fashion delivered to your doorstep." />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="../assets/img/favicon.ico" />

    <style>
        :root {
            --bg: #F9F5F1;
            --card: #fff;
            --rose: #C89A7B;
            --rose-dark: #B58465;
            --text: #3E312C;
            --text-muted: #8B7E78;
            --border: #E8DED5;
            --success: #10B981;
            --shadow: 0 2px 12px rgba(62, 49, 44, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .checkout-header {
            text-align: center;
            padding: 40px 0 20px;
        }

        .checkout-header h1 {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .checkout-header .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .checkout-header .breadcrumb a {
            color: var(--rose);
        }

        /* Layout */
        .checkout-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 32px;
            padding: 20px 0 60px;
            align-items: start;
        }

        /* Card */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #5C4A42;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--bg);
            font-size: 0.9rem;
            font-family: 'Manrope', sans-serif;
            outline: none;
            transition: all 0.25s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 4px rgba(200, 154, 123, 0.1);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group .required {
            color: #e74c3c;
        }

        /* Order Items */
        .order-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg);
            flex-shrink: 0;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-info h4 {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .order-item-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .order-item-price {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .order-total.grand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            border-top: 2px solid var(--border);
            padding-top: 14px;
            margin-top: 8px;
        }

        .order-total.grand span:last-child {
            color: var(--rose-dark);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.25s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.03em;
        }

        .btn-primary {
            background: var(--rose);
            color: #fff;
            box-shadow: 0 4px 14px rgba(200, 154, 123, 0.3);
        }

        .btn-primary:hover {
            background: var(--rose-dark);
            transform: translateY(-2px);
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart i {
            font-size: 3rem;
            color: #D4B09A;
            margin-bottom: 12px;
        }

        .empty-cart h3 {
            margin-bottom: 8px;
        }

        .empty-cart p {
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Success Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 20, 15, 0.6);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.2);
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-card .check-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #D1FAE5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            color: var(--success);
        }

        .modal-card h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .modal-card .order-id {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--rose);
            margin-bottom: 4px;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .modal-card .btn {
            margin: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 24px;
            z-index: 9999;
            background: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border-left: 3px solid var(--rose);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateX(120%);
            transition: all 0.4s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            border-left-color: #e74c3c;
        }

        /* Sticky Summary */
        @media (min-width: 769px) {
            .order-summary {
                position: sticky;
                top: 90px;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .checkout-header h1 {
                font-size: 1.6rem;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="checkout-header">
            <h1>Checkout</h1>
            <p class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / Checkout</p>
        </div>

        <div class="checkout-layout" id="checkoutLayout">
            <!-- Left: Form -->
            <div>
                <div class="card">
                    <h3>Customer Information</h3>
                    <div class="form-row">
                        <div class="form-group"><label>Full Name <span class="required">*</span></label><input
                                type="text" id="fullName" placeholder="Your full name" required /></div>
                        <div class="form-group"><label>Phone Number <span class="required">*</span></label><input
                                type="tel" id="phone" placeholder="08012345678" required /></div>
                    </div>
                    <div class="form-group"><label>Email (Optional)</label><input type="email" id="email"
                            placeholder="your@email.com" /></div>
                </div>

                <div class="card">
                    <h3>Delivery Details</h3>
                    <div class="form-group"><label>Address <span class="required">*</span></label><input type="text"
                            id="address" placeholder="House number, street name" required /></div>
                    <div class="form-row">
                        <div class="form-group"><label>State <span class="required">*</span></label><input type="text"
                                id="state" placeholder="e.g., Lagos" required /></div>
                        <div class="form-group"><label>City</label><input type="text" id="city"
                                placeholder="e.g., Ikeja" /></div>
                    </div>
                    <div class="form-group"><label>Landmark (Optional)</label><input type="text" id="landmark"
                            placeholder="Nearest bus stop or landmark" /></div>
                    <div class="form-group"><label>Order Notes</label><textarea id="notes"
                            placeholder="Any special instructions..."></textarea></div>
                </div>

                <button class="btn btn-primary btn-block" id="placeOrderBtn" onclick="placeOrder()">
                    <i class="fas fa-lock"></i> Place Order
                </button>
            </div>

            <!-- Right: Order Summary -->
            <div class="order-summary">
                <div class="card">
                    <h3>Order Summary</h3>
                    <div id="orderItems"></div>
                    <div class="order-total"><span>Subtotal</span><span id="displaySubtotal">N0</span></div>
                    <div class="order-total"><span>Delivery</span><span id="displayDelivery">N2,500</span></div>
                    <div class="order-total grand"><span>Total</span><span id="displayTotal">N0</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <div class="check-circle"><i class="fas fa-check-circle"></i></div>
            <h3>Order Received!</h3>
            <p id="successMessage"></p>
            <div class="order-id" id="successOrderId"></div>
            <p style="color:var(--text-muted);font-size:0.8rem;">Our team will review your order and confirm the next
                steps.</p>
            <button class="btn btn-primary" onclick="window.location.href='index.html'"><i class="fas fa-home"></i>
                Continue Shopping</button>
            <button class="btn btn-primary"
                style="background:#fff;color:var(--rose);border:1.5px solid var(--rose);margin-top:8px;"
                onclick="document.getElementById('successModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="fas fa-check-circle" style="color:var(--rose);"></i><span
            id="toastMsg">Success!</span></div>

    <script type="module">
        import { createOrder, addDocument } from '../assets/js/firebase-init.js';

        const $ = s => document.querySelector(s);
        const DELIVERY_FEE = 2500;

        function getCart() { return JSON.parse(localStorage.getItem('fe_cart') || '[]'); }
        function getSubtotal() { return getCart().reduce((s, i) => s + (i.price * i.qty), 0); }
        function getTotal() { return getSubtotal() + DELIVERY_FEE; }
        function formatPrice(n) { return 'N' + Number(n).toLocaleString(); }

        function showToast(msg, error = false) {
            const t = $('#toast'); const m = $('#toastMsg');
            if (error) { t.classList.add('error'); t.querySelector('i').className = 'fas fa-exclamation-circle'; t.querySelector('i').style.color = '#e74c3c'; }
            else { t.classList.remove('error'); t.querySelector('i').className = 'fas fa-check-circle'; t.querySelector('i').style.color = '#C89A7B'; }
            m.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function renderOrderSummary() {
            const cart = getCart();
            const container = $('#orderItems');

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-bag"></i><h3>Your cart is empty</h3><p>Add products from the shop first</p><a href="shop.html" class="btn btn-primary">Browse Shop</a></div>';
                $('#placeOrderBtn').disabled = true;
                $('#placeOrderBtn').style.opacity = '0.5';
                $('#displaySubtotal').textContent = 'N0';
                $('#displayTotal').textContent = 'N0';
                return;
            }

            container.innerHTML = cart.map(i => `
                <div class="order-item">
                    <img src="${i.image || ''}" class="order-item-img" onerror="this.style.background='var(--bg)'" />
                    <div class="order-item-info"><h4>${i.name}</h4><p>Qty: ${i.qty} x ${formatPrice(i.price)}</p></div>
                    <div class="order-item-price">${formatPrice(i.price * i.qty)}</div>
                </div>`).join('');

            $('#displaySubtotal').textContent = formatPrice(getSubtotal());
            $('#displayTotal').textContent = formatPrice(getTotal());
        }

        window.placeOrder = async function () {
            const name = $('#fullName')?.value?.trim() || '';
            const phone = $('#phone')?.value?.trim() || '';
            const email = $('#email')?.value?.trim() || '';
            const address = $('#address')?.value?.trim() || '';
            const state = $('#state')?.value?.trim() || '';
            const city = $('#city')?.value?.trim() || '';
            const landmark = $('#landmark')?.value?.trim() || '';
            const notes = $('#notes')?.value?.trim() || '';

            if (!name || !phone || !address || !state) {
                showToast('Please fill all required fields', true);
                return;
            }

            const cart = getCart();
            if (cart.length === 0) {
                showToast('Your cart is empty', true);
                return;
            }

            const btn = $('#placeOrderBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const subtotal = getSubtotal();
            const total = subtotal + DELIVERY_FEE;

            const orderData = {
                customer: name,
                phone: phone,
                email: email,
                products: cart.map(i => ({ name: i.name, qty: i.qty, price: i.price, image: i.image, total: i.price * i.qty })),
                subtotal: subtotal,
                delivery: DELIVERY_FEE,
                total: total,
                address: address,
                state: state,
                city: city,
                landmark: landmark,
                notes: notes,
            };

            // Save to Firestore
            const result = await createOrder(orderData);

            if (result.success) {
                // Clear cart
                localStorage.setItem('fe_cart', '[]');
                localStorage.setItem('cartCount', '0');

                // Update cart badge
                const badge = document.getElementById('cartCount');
                if (badge) { badge.textContent = '0'; badge.style.display = 'none'; }

                // Show success
                $('#successMessage').textContent = `Thank you, ${name}. Your order has been successfully received.`;
                $('#successOrderId').textContent = result.orderId || ('FE-' + new Date().getFullYear() + '-' + result.id.slice(-4));
                $('#successModal').classList.add('active');

                // Render empty cart
                renderOrderSummary();
            } else {
                showToast('Error placing order. Please try again.', true);
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock"></i> Place Order';
        };

        renderOrderSummary();
    </script>
</body>

</html>
